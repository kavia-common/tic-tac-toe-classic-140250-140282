# Build performance tuning for constrained CI runners to avoid timeouts
# Use very conservative memory and single worker to avoid GC pauses and Docker executor timeouts.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -XX:+UseStringDeduplication
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.vfs.watch=false

# Kotlin optimizations
# Keep Kotlin daemon memory low as well to avoid OOM on small runners.
kotlin.daemon.jvm.options=-Xmx512m
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.incremental.android=true

# Android optimizations
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.debug.testCoverageEnabled=false